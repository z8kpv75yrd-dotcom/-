<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Неправильные глаголы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: одна колонка до 480px, карточка по центру, кнопки ответа под ней, фильтры в горизонтальной ленте */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#111a2e; --muted:#5b6579; --line:#d5dbe6;
  --accent:#1d4ed8; --accent-ink:#ffffff;
  --ok:#12805c; --ok-bg:#dff3ea; --bad:#b4281f; --bad-bg:#fbe3e0;
  --display:"Bricolage Grotesque","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1220; --surface:#151d30; --ink:#eaf0ff; --muted:#93a0bb; --line:#26314a;
    --accent:#7ea2ff; --accent-ink:#0c1220;
    --ok:#5fd3a2; --ok-bg:#12332a; --bad:#ff8f86; --bad-bg:#3a1a1a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1220; --surface:#151d30; --ink:#eaf0ff; --muted:#93a0bb; --line:#26314a;
  --accent:#7ea2ff; --accent-ink:#0c1220;
  --ok:#5fd3a2; --ok-bg:#12332a; --bad:#ff8f86; --bad-bg:#3a1a1a; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;
  padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:480px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.stats b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.stats .ok b{color:var(--ok)} .stats .bad b{color:var(--bad)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .k{background:var(--ok)} .bar .m{background:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;color:var(--muted)}
.toggle{font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:none;border:1.5px solid var(--line);
  border-radius:10px;padding:8px 12px;cursor:pointer}
.toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.card{width:100%;min-height:300px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;
  padding:24px 20px;display:flex;flex-direction:column;justify-content:center;gap:20px;text-align:left;
  font:inherit;color:inherit;cursor:pointer}
.card.static{cursor:default}
.hint{font-size:15px;color:var(--muted)}
.inf{font-family:var(--display);font-weight:800;font-size:clamp(40px,14vw,60px);line-height:1;overflow-wrap:anywhere}
.inf.small{font-size:24px;color:var(--muted);font-weight:600}
.forms{display:flex;flex-direction:column;gap:14px}
.form .lbl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.form .val{font-family:var(--mono);font-weight:600;font-size:clamp(28px,9vw,38px);line-height:1.15;overflow-wrap:anywhere}
.form.second .val{color:var(--accent)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{font:inherit;font-size:18px;font-weight:600;border:0;border-radius:14px;padding:18px 12px;cursor:pointer;min-height:60px}
.btn.no{background:var(--bad-bg);color:var(--bad)}
.btn.yes{background:var(--ok-bg);color:var(--ok)}
.btn.main{background:var(--accent);color:var(--accent-ink);grid-column:1/-1}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.end h2{font-family:var(--display);font-size:26px;margin:0}
.end p{margin:0;color:var(--muted)}
.reset{align-self:center;font:inherit;font-size:14px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:8px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>

<div class="wrap">
  <h1>Неправильные глаголы</h1>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar"></div>
  <div class="chips" id="chips"></div>
  <div class="row"><span id="pos"></span><button class="toggle" id="shuf" aria-pressed="false" type="button">Перемешать</button></div>
  <div id="stage"></div>
  <button class="reset" id="reset" type="button">Сбросить прогресс</button>
</div>

<script>
const V = [
["be","was/were","been","o"],["become","became","become","o"],["begin","began","begun","a"],
["break","broke","broken","n"],["bring","brought","brought","t"],["build","built","built","t"],
["buy","bought","bought","t"],["can","could","been able","o"],["catch","caught","caught","t"],
["choose","chose","chosen","n"],["come","came","come","o"],["cost","cost","cost","s"],
["dig","dug","dug","t"],["do","did","done","o"],["draw","drew","drawn","p"],
["drink","drank","drunk","a"],["drive","drove","driven","n"],["eat","ate","eaten","n"],
["fall","fell","fallen","n"],["feed","fed","fed","t"],["feel","felt","felt","t"],
["find","found","found","t"],["fly","flew","flown","p"],["forget","forgot","forgotten","n"],
["get","got","got","t"],["give","gave","given","n"],["go","went","gone/been","o"],
["grow","grew","grown","p"],["have","had","had","t"],["hear","heard","heard","t"],
["hold","held","held","t"],["hurt","hurt","hurt","s"],["keep","kept","kept","t"],
["know","knew","known","p"],["learn","learned/learnt","learned/learnt","t"],["leave","left","left","t"],
["let","let","let","s"],["lose","lost","lost","t"],["make","made","made","t"],
["mean","meant","meant","t"],["meet","met","met","t"],["pay","paid","paid","t"],
["put","put","put","s"],["read /ri:d/","read /red/","read /red/","s"],["ride","rode","ridden","n"],
["ring","rang","rung","a"],["run","ran","run","o"],["say","said","said","t"],
["see","saw","seen","p"],["sell","sold","sold","t"],["send","sent","sent","t"],
["shine","shone","shone","t"],["show","showed","shown","p"],["sing","sang","sung","a"],
["sit","sat","sat","t"],["sleep","slept","slept","t"],["speak","spoke","spoken","n"],
["spend","spent","spent","t"],["stand","stood","stood","t"],["steal","stole","stolen","n"],
["swim","swam","swum","a"],["take","took","taken","n"],["teach","taught","taught","t"],
["tell","told","told","t"],["think","thought","thought","t"],["throw","threw","thrown","p"],
["understand","understood","understood","t"],["wear","wore","worn","n"],["win","won","won","t"],
["write","wrote","written","n"]
].map(([inf,p2,p3,g])=>({inf,p2,p3,g}));

const GROUPS=[["s","Все формы одинаковые"],["t","2-я = 3-я"],["a","i → a → u"],["n","3-я на -n / -en"],["p","3-я = инфинитив + n"],["o","Особые"]];
const KEY="irregular-verbs-status";
let status={};
try{status=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){status={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(status))}catch(e){}}

let filter="all",shuffle=false,deck=[],i=0,shown=false,rk=0,rm=0;
const $=id=>document.getElementById(id);

function shuffled(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function build(){
  let d=V;
  if(filter==="missed")d=V.filter(v=>status[v.inf]==="missed");
  else if(filter!=="all")d=V.filter(v=>v.g===filter);
  deck=shuffle?shuffled(d):d.slice();
  i=0;shown=false;rk=0;rm=0;
}
function count(s){return V.filter(v=>status[v.inf]===s).length}

function renderChips(){
  const miss=count("missed");
  const items=[["all","Все ("+V.length+")"],["missed","Ошибки ("+miss+")"],...GROUPS.map(([g,n])=>[g,n+" ("+V.filter(v=>v.g===g).length+")"])];
  $("chips").innerHTML="";
  items.forEach(([id,label])=>{
    const b=document.createElement("button");
    b.type="button";b.className="chip";b.textContent=label;
    b.setAttribute("aria-pressed",String(filter===id));
    b.onclick=()=>{filter=id;build();render()};
    $("chips").appendChild(b);
  });
}
function renderStats(){
  const k=count("known"),m=count("missed"),n=V.length-k-m;
  $("stats").innerHTML='<span class="ok">Знаю <b>'+k+'</b></span><span class="bad">Ошибки <b>'+m+'</b></span><span>Не проверено <b>'+n+'</b></span>';
  $("bar").innerHTML='<i class="k" style="width:'+(k/V.length*100)+'%"></i><i class="m" style="width:'+(m/V.length*100)+'%"></i>';
}
function mark(s){
  status[deck[i].inf]=s;save();
  if(s==="known")rk++;else rm++;
  i++;shown=false;render();
}
function renderStage(){
  const st=$("stage");
  if(!deck.length){
    st.innerHTML='<div class="card static end"><h2>'+(filter==="missed"?"Ошибок нет":"Пусто")+'</h2><p>'+(filter==="missed"?"Забытые глаголы будут собираться здесь.":"В этой группе нет глаголов.")+'</p></div>';
    return;
  }
  if(i>=deck.length){
    const miss=count("missed");
    st.innerHTML='<div class="card static end"><h2>Круг пройден</h2><p>Знаю: '+rk+'. Забыл: '+rm+'.</p></div>'+
      '<div class="answers" style="margin-top:12px">'+
      (miss?'<button class="btn main" id="again-miss" type="button">Повторить ошибки ('+miss+')</button>':'')+
      '<button class="btn ghost" id="again" type="button" style="grid-column:1/-1">Ещё раз</button></div>';
    if(miss)$("again-miss").onclick=()=>{filter="missed";build();render()};
    $("again").onclick=()=>{build();render()};
    return;
  }
  const v=deck[i];
  if(!shown){
    st.innerHTML='<button class="card" id="card" type="button"><div class="hint">Вспомни 2-ю и 3-ю формы</div><div class="inf"></div><div class="hint">Нажми, чтобы открыть</div></button>';
    st.querySelector(".inf").textContent=v.inf;
    $("card").onclick=()=>{shown=true;render()};
  }else{
    st.innerHTML='<div class="card static"><div class="inf small"></div><div class="forms">'+
      '<div class="form second"><div class="lbl">2-я форма · Past Simple</div><div class="val" id="v2"></div></div>'+
      '<div class="form"><div class="lbl">3-я форма · Past Participle</div><div class="val" id="v3"></div></div></div></div>'+
      '<div class="answers" style="margin-top:12px"><button class="btn no" id="no" type="button">Забыл</button><button class="btn yes" id="yes" type="button">Знаю</button></div>';
    st.querySelector(".inf").textContent=v.inf;
    $("v2").textContent=v.p2;$("v3").textContent=v.p3;
    $("no").onclick=()=>mark("missed");$("yes").onclick=()=>mark("known");
  }
}
function render(){
  renderChips();renderStats();
  $("pos").textContent=deck.length?("Карточка "+Math.min(i+1,deck.length)+" из "+deck.length):"";
  $("shuf").setAttribute("aria-pressed",String(shuffle));
  renderStage();
}
$("shuf").onclick=()=>{shuffle=!shuffle;build();render()};
$("reset").onclick=()=>{status={};save();build();render()};
build();render();
</script>

</body></html>
